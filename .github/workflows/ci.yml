name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v

      - name: Check spec worked-examples are covered
        run: |
          # Placeholder: fails loudly until someone wires up a real check.
          # Suggestion: tag spec-derived fixtures with @pytest.mark.spec_example
          # and assert at least N such tests exist per module.
          echo "TODO: enforce spec-example test coverage"
